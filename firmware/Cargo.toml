[package]
edition      = "2024"
name         = "fimur"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "fimur"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "1.0", features = ["defmt", "esp32c6", "unstable"] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32c6"] }

critical-section = "1.2.0"
esp-backtrace = { version = "0.18.1", features = [
  "defmt",
  "esp32c6",
  "panic-handler",
] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32c6"] }
smart-leds = "0.4.0"
esp-hal-smartled = "0.17.0"

imu-traits = { path = "../imu-traits"}
icm20948 = { path = "../icm20948"}
libm = "0.2.16"
embedded-hal-bus = "0.3.0"
embedded-hal = "1.0"
heapless = "0.9.2"
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }
xca9548a = "1.0.0"
